version: '3.8'

services:
  agentstack:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./agentstack:/app/agentstack
      - ./examples:/app/examples
    command: python -m examples.quickstart

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Optional: Add vector database for semantic search
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
